
name: Solar House APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Solar House ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT")
          cp -a "$PROJECT_DIR"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solar-House-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
