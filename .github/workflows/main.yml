
name: Solar House APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          mkdir -p extracted
          unzip -q solar-house-apk-build-ready.zip -d extracted

          echo "Searching project files..."

          find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "gradlew" \
          \)

          WRAPPER=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$WRAPPER"

          echo "Android project found: $PROJECT_DIR"

      - name: Build Solar House APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solar-House-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
