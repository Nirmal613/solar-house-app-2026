
name: Solar House APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android Project
        shell: bash
        run: |
          mkdir extracted
          unzip -q solar-house-apk-build-ready.zip -d extracted

          PROJECT=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          cp -a "$PROJECT_DIR"/. .

          echo "Project extracted successfully"
          ls -la

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solar-House-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
