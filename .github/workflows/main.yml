
name: Solar House APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q solar-house-apk-build-ready.zip -d extracted

          echo "Searching Android project..."
          find extracted -type f -name settings.gradle.kts

          SETTINGS=$(find extracted -type f -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project folder: $PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

          cp -a "$PROJECT_DIR"/. .

          echo "Project files:"
          ls -la

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solar-House-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
