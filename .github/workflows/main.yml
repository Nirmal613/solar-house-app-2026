
name: Solar House APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Setup
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="solar-house-apk-build-ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP FILE NOT FOUND"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -name settings.gradle.kts -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ANDROID PROJECT NOT FOUND"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cp -a "$PROJECT_DIR"/. .

          echo "PROJECT READY"

      - name: Accept SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Solar House APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Solar-House-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
